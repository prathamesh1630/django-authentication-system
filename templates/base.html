<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Account Portal{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 55%, #e0f2fe 100%);
            color: #172033;
        }
        .navbar-brand { font-weight: 700; letter-spacing: .2px; }
        .page-wrap { min-height: calc(100vh - 140px); display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem; }
        .auth-card { width: 100%; max-width: 520px; border: 0; border-radius: 1.25rem; box-shadow: 0 1rem 2.5rem rgba(15, 23, 42, .10); }
        .auth-card .card-body { padding: clamp(1.5rem, 4vw, 2.5rem); }
        .form-control, .form-select { border-radius: .7rem; padding: .7rem .85rem; }
        label { font-weight: 600; margin-bottom: .4rem; }
        .btn { border-radius: .7rem; padding: .65rem 1rem; font-weight: 600; }
        .helptext, .form-text { color: #64748b; font-size: .875rem; }
        ul.errorlist { list-style: none; padding: 0; margin: .35rem 0; color: #b91c1c; font-size: .9rem; }
        footer { color: #64748b; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Account Portal</a>
        <div class="ms-auto d-flex gap-2">
            {% if request.user.is_authenticated %}
                <a class="btn btn-outline-light btn-sm" href="{% url 'home' %}">Home</a>
                <a class="btn btn-light btn-sm" href="{% url 'signout' %}">Sign out</a>
            {% else %}
                <a class="btn btn-outline-light btn-sm" href="{% url 'signin' %}">Sign in</a>
                <a class="btn btn-light btn-sm" href="{% url 'register' %}">Create account</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="page-wrap">
    <div class="container">
        {% if messages %}
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    {% for message in messages %}
                        <div class="alert
                            {% if message.tags == 'error' %}alert-danger
                            {% elif message.tags == 'success' %}alert-success
                            {% elif message.tags == 'warning' %}alert-warning
                            {% else %}alert-info{% endif %}
                            alert-dismissible fade show shadow-sm" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</main>

<footer class="text-center py-3 small">Secure account management</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
