{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Forgot password | Account Portal{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card auth-card mx-auto">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="fs-1 mb-2">🔐</div>
                    <h1 class="h3 fw-bold">Forgot password?</h1>
                    <p class="text-secondary mb-0">Enter your details to identify your account.</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Identify account</button>
                </form>
                <p class="text-center mt-4 mb-0"><a href="{% url 'signin' %}" class="link-secondary">Back to sign in</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
