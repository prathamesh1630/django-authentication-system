{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Create account | Account Portal{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card auth-card mx-auto">
            <div class="card-body">
                <div class="text-center mb-4">
                    <h1 class="h3 fw-bold">Create your account</h1>
                    <p class="text-secondary mb-0">Fill in the details below to get started.</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Register</button>
                </form>
                <p class="text-center mt-4 mb-0">Already have an account? <a href="{% url 'signin' %}">Sign in</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
